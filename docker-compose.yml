version: '3.8'

services:
  # MLflow Tracking Server
  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    container_name: churn_mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
      - ./mlartifacts:/mlflow/mlartifacts
    networks:
      - churn_network
    restart: unless-stopped

  # Main Application (for running pipelines)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn_app
    volumes:
      - .:/app
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONUNBUFFERED=1
    depends_on:
      - mlflow
    networks:
      - churn_network
    command: tail -f /dev/null  # Keep container running

  # Streamlit Dashboard (will be implemented in Module 7)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn_dashboard
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONUNBUFFERED=1
    depends_on:
      - mlflow
    networks:
      - churn_network
    command: streamlit run dashboards/app.py --server.port=8501 --server.address=0.0.0.0
    profiles:
      - dashboard  # Only start when explicitly requested

networks:
  churn_network:
    driver: bridge

volumes:
  mlruns:
  mlartifacts:
